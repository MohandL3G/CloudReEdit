name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the release (e.g. 0.2.7)'
        required: false
        default: '0.2.7'
      release_notes:
        description: 'Optional release notes (plain text)'
        required: false
        default: ''
      release:
        description: 'Publish the GitHub release (uncheck to only build the exe artifact)'
        type: boolean
        required: false
        default: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/CloudReEdit.Tests/CloudReEdit.Tests.csproj

      - name: Publish (single-file exe)
        run: dotnet publish ui/CloudReEdit.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CloudReEdit
          path: ui/bin/Release/net8.0-windows/win-x64/publish/CloudReEdit.exe

      - name: Publish GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          if ($env:NOTES) { $flags += @('--notes', $env:NOTES) } else { $flags += '--generate-notes' }
          gh release create "v$env:VERSION" `
            "ui/bin/Release/net8.0-windows/win-x64/publish/CloudReEdit.exe" `
            --title "CloudReEdit v$env:VERSION" `
            @flags
